<!DOCTYPE html>
<html lang="ru" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta property="og:image" content="https://aldena.by/images/logo.jpg">
        <title>{{ title or "AldenaGroup" }}</title>
        <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
        <link href="/templates/extrit/fonts/fonts.css" rel="stylesheet">
        <link href="/css/base.css" rel="stylesheet">
        <link href="/css/header.css" rel="stylesheet">
        <link href="/css/footer.css" rel="stylesheet">
        <link href="/css/modal.css" rel="stylesheet">
        <link href="/css/sections.css" rel="stylesheet">
        <link href="/css/hero.css" rel="stylesheet">
        <link href="/css/cta.css" rel="stylesheet">
        {% for css in pageCss or [] %}
        <link href="/css/{{ css }}" rel="stylesheet">
        {% endfor %}
    </head>
    <body>
        {% include "partials/site-header.html" %}
        <main tabindex="-1" id="main-content">
            {% if breadcrumbs %}
            {% include "partials/crumbs.html" %}
            {% endif %}
            {{ content | safe }}
        </main>
        {% include "partials/site-footer.html" %}
        {% include "partials/site-modal.html" %}
        <script src="/js/site.js" defer></script>
    </body>
</html>
